<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="system-ui, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="1200" height="560" rx="20" fill="#ffffff" stroke="#e2e8f0"/>

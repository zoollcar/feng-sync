name: Build and release

on:
  push:
    tags: ['v*']

# A force-updated tag must not leave two release builds running at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Keep the default token read-only. The release job gets the only write permission.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  RUNTIME_IDENTIFIER: win-x64

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and build
        shell: pwsh
        run: dotnet build ./FengSync.sln -c $env:CONFIGURATION --nologo

      - name: Verify manifest generation and update package compatibility
        shell: pwsh
        run: dotnet test ./tests/FengSync.Tests/FengSync.Tests.csproj -c $env:CONFIGURATION --no-build --nologo --filter "FullyQualifiedName~ReleaseManifestTests|FullyQualifiedName~UpdatePackageSafetyTests"

      - name: Publish release package
        id: package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must use semantic versioning, for example v0.1.11. Received: ${{ github.ref_name }}"
          }

          $publishDir = Join-Path $env:RUNNER_TEMP 'feng-sync-publish'
          $updaterDir = Join-Path $env:RUNNER_TEMP 'feng-sync-updater'
          $packageRoot = Join-Path $env:RUNNER_TEMP "FengSync-$version-win-x64"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "FengSync-$version-win-x64.zip"

          # Pin InformationalVersion too: on Windows it is the EXE ProductVersion read by
          # the application and the release-package gate below.  Suppress the SDK's
          # SourceRevisionId suffix so ProductVersion equals the three-part release tag.
          dotnet publish ./src/FengSync/FengSync.csproj -c $env:CONFIGURATION -r $env:RUNTIME_IDENTIFIER --self-contained true -p:Version=$version -p:InformationalVersion=$version -p:IncludeSourceRevisionInInformationalVersion=false -o $publishDir
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }

          dotnet publish ./src/FengSync.Updater/FengSync.Updater.csproj -c $env:CONFIGURATION -r $env:RUNTIME_IDENTIFIER --self-contained true -p:Version=$version -p:InformationalVersion=$version -p:IncludeSourceRevisionInInformationalVersion=false -o $updaterDir
          if ($LASTEXITCODE -ne 0) { throw 'Updater publish failed.' }
          Copy-Item -LiteralPath (Join-Path $updaterDir 'FengSync.Updater.exe') -Destination (Join-Path $publishDir 'FengSync.Updater.exe') -Force
          ./scripts/New-ReleaseManifest.ps1 -PublishDirectory $publishDir -Version $version
          foreach ($required in @('FengSync.exe', 'FengSync.Updater.exe', 'release-manifest.json', 'Assets/rclone/rclone.exe')) { if (!(Test-Path (Join-Path $publishDir $required))) { throw "Release output missing: $required" } }
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          Copy-Item -Path (Join-Path $publishDir '*') -Destination $packageRoot -Recurse -Force
          Compress-Archive -Path $packageRoot -DestinationPath $zipPath -CompressionLevel Optimal
          $shaPath = "$zipPath.sha256"
          $zipHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $(Split-Path $zipPath -Leaf)" | Set-Content -LiteralPath $shaPath -NoNewline

          # Keep the update client and published release contract in lockstep.
          ./scripts/Test-ReleasePackage.ps1 -PublishDirectory $publishDir -Version $version -ZipPath $zipPath -Sha256Path $shaPath

          "asset_name=FengSync-$version-win-x64.zip" >> $env:GITHUB_OUTPUT
          "asset_path=$zipPath" >> $env:GITHUB_OUTPUT
          "sha_path=$shaPath" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub Release
        # Release assets are the single durable copy. Do not also upload this
        # package with actions/upload-artifact: that consumes Actions storage.
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.asset_path }}
            ${{ steps.package.outputs.sha_path }}

name: Build and release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# The release job uses this to create a GitHub Release and attach its package.
permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  RUNTIME_IDENTIFIER: win-x64

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and build
        shell: pwsh
        run: dotnet build ./FengSync.sln -c $env:CONFIGURATION --nologo

  release:
    # Only version tags publish software. Branch and pull-request builds only validate it.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/FengSync.Core/SftpServer/package-lock.json

      - name: Publish release package
        id: package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+([-.+].+)?$') {
            throw "Release tag must use semantic versioning, for example v0.1.11. Received: ${{ github.ref_name }}"
          }

          $publishDir = Join-Path $env:RUNNER_TEMP 'feng-sync-publish'
          $packageRoot = Join-Path $env:RUNNER_TEMP "FengSync-$version-win-x64"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "FengSync-$version-win-x64.zip"

          dotnet publish ./src/FengSync/FengSync.csproj -c $env:CONFIGURATION -r $env:RUNTIME_IDENTIFIER --self-contained true -p:Version=$version -o $publishDir
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }

          # Bundle the pinned SFTP server dependency next to the protocol host.
          $sftpDir = Join-Path $publishDir 'SftpServer'
          npm ci --omit=dev --prefix $sftpDir
          if ($LASTEXITCODE -ne 0) { throw 'Installing the bundled SFTP dependency failed.' }

          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          Copy-Item -Path (Join-Path $publishDir '*') -Destination $packageRoot -Recurse -Force
          Compress-Archive -Path $packageRoot -DestinationPath $zipPath -CompressionLevel Optimal

          "asset_name=FengSync-$version-win-x64.zip" >> $env:GITHUB_OUTPUT
          "asset_path=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset_name }}
          path: ${{ steps.package.outputs.asset_path }}
          if-no-files-found: error

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.package.outputs.asset_path }}
